# Dub Station: dub-techno tape delay + huge (Galactic) reverb + a filtered noise bed + phaser. Three pages.
# RE-201 look via the browser renderer (vst.json "art": "html", skin.css + art/*.svg): brushed-silver strips
# top/bottom over a green centre faceplate (chassis.svg), green section panels (no frame/screws), one black
# field per page, VU inside OUTPUT, logo in the top strip. Coords: 1280 wide, y 86..714 visible. r=46.
art_css=skin.css
hide_qlink_bounds=1
theme_bg=2d4626
theme_panel=39572f
theme_line=c6ccce
theme_ink=eef1ec
theme_ink_dim=cdd4cd
theme_ink_faint=9aa89e
theme_accent=4fbf86
theme_accent_hi=7fe0ac
theme_knob_face=141414
theme_knob_ring=3a3a36
theme_knob_dot=f2f3ef
theme_seg_active=3fae6f
theme_seg_inactive=18211b
theme_seg_active_tx=0b1510
font_label=tools/html_art/fonts/TitilliumWeb-Regular.ttf
# Photoreal Moog knob: a 128-frame filmstrip (black knurled skirt, brushed-silver cap, white tick),
# reused from sd88me/mpc-vst-maze (MIT). images/make_knob_strip.py rebuilds it from moog_knob_5frames.png.
knob_strip=images/moog_knob_voice.png

[tab DELAY]
art file=art/chassis.svg x=0 y=86 w=1280 h=628
art file=art/logo.svg x=40 y=98 w=320 h=48
art file=art/grunge.png x=0 y=86 w=1280 h=628 fit=stretch

# SYNC is a small LED next to TIME (green=synced); WIDTH left of LEVEL. Delay B has no RESONANCE:
# a single bipolar TONE knob (LP/HP) instead, so B differs from A. SAT (A+B) is global on both tails.
frame x=20 y=158 w=860 h=238 title="DELAY A"
toggle cx=52 cy=288 look=led label="SYNC" key=sync
knob cx=150 cy=288 r=46 label="TIME" key=time
knob cx=282 cy=288 r=46 label="FEEDBACK" key=feedback
knob cx=414 cy=288 r=46 label="FILTER" key=fbfilter
knob cx=546 cy=288 r=46 label="RESONANCE" key=fbreso
knob cx=678 cy=288 r=46 label="WIDTH" key=width
knob cx=810 cy=288 r=46 label="LEVEL" key=delay

frame x=20 y=404 w=860 h=238 title="DELAY B"
toggle cx=52 cy=534 look=led label="SYNC" key=sync2
knob cx=150 cy=534 r=46 label="TIME" key=time2
knob cx=282 cy=534 r=46 label="FEEDBACK" key=feedback2
knob cx=414 cy=534 r=46 label="FILTER" key=tone2
knob cx=546 cy=534 r=46 label="FLANGER" key=flanger
knob cx=678 cy=534 r=46 label="WIDTH" key=width2
knob cx=810 cy=534 r=46 label="LEVEL" key=delay2

art file=art/panel_sat.svg x=892 y=158 w=140 h=484
art file=art/grime_panel.png x=892 y=158 w=140 h=484 fit=stretch
knob cx=962 cy=400 r=46 label="SATURATION" key=sat

art file=art/panel_out1.svg x=1044 y=158 w=216 h=484
art file=art/grime_panel.png x=1044 y=158 w=216 h=484 fit=stretch
knob cx=1152 cy=266 r=46 label="DUCKING" key=duck
button cx=1152 cy=425 label="PANIC" key=panic color=b23a2e w=170 h=66
knob cx=1152 cy=522 r=46 label="MIX" key=mix

qlinks "DELAY" = time,feedback,fbfilter,fbreso,width,sync,delay,sat,time2,feedback2,tone2,flanger,width2,delay2,duck,mix

[tab SPACE / TAPE]
art file=art/chassis.svg x=0 y=86 w=1280 h=628
art file=art/logo.svg x=40 y=98 w=320 h=48
art file=art/grunge.png x=0 y=86 w=1280 h=628 fit=stretch
art file=art/panel_space.svg x=20 y=158 w=760 h=500
art file=art/grime_panel.png x=20 y=158 w=760 h=500 fit=stretch
knob cx=100 cy=390 r=46 label="SIZE" key=size
knob cx=245 cy=390 r=46 label="AMOUNT" key=reverb
knob cx=390 cy=390 r=46 label="DAMP" key=damp
knob cx=535 cy=390 r=46 label="HI-PASS" key=hipass
knob cx=680 cy=390 r=46 label="DRIFT" key=drift

frame x=800 y=158 w=460 h=500 title="TAPE"
knob cx=880 cy=390 r=46 label="DRIVE" key=drive
knob cx=1025 cy=390 r=46 label="WARBLE" key=warble
knob cx=1170 cy=390 r=46 label="DEGRADE" key=degrade

qlinks "SPACE / TAPE" = size,reverb,damp,hipass,drift,drive,warble,degrade

[tab AIR / MOD]
art file=art/chassis.svg x=0 y=86 w=1280 h=628
art file=art/logo.svg x=40 y=98 w=320 h=48
art file=art/grunge.png x=0 y=86 w=1280 h=628 fit=stretch
art file=art/panel_ambience.svg x=20 y=158 w=730 h=500
art file=art/grime_panel.png x=20 y=158 w=730 h=500 fit=stretch
knob cx=110 cy=390 r=46 label="NOISE" key=noise
knob cx=290 cy=390 r=46 label="TONE" key=noisefilt
knob cx=470 cy=390 r=46 label="MOTION" key=noisemod
knob cx=640 cy=390 r=46 label="CRACKLE" key=crackle

# AMBIENCE right edge 750, PHASER left edge 760 -> the divider gap sits at 755, exactly between CRACKLE (640) and RATE (870)
frame x=760 y=158 w=500 h=500 title="PHASER"
knob cx=870 cy=390 r=46 label="RATE" key=phzrate
knob cx=1080 cy=390 r=46 label="DEPTH" key=phzdepth
art file=art/vu.svg x=890 y=528 w=210 h=105

qlinks "AIR / MOD" = noise,noisefilt,noisemod,crackle,phzrate,phzdepth
