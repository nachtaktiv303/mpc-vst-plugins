<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 120">
  <!-- bezel -->
  <rect x="2" y="2" width="236" height="116" rx="8" fill="#0c110e" stroke="#2c352e" stroke-width="1.5"/>
  <!-- warm meter face -->
  <rect x="14" y="12" width="212" height="78" rx="4" fill="#e9e2cc"/>
  <rect x="14" y="12" width="212" height="24" rx="4" fill="#ffffff" opacity="0.18"/>
  <!-- scale arc, pivot ~ (120,112), R=92, from -45deg to +45deg -->
  <path d="M 55 47 A 92 92 0 0 1 185 47" fill="none" stroke="#3a3a3a" stroke-width="1.6"/>
  <!-- red overload zone -->
  <path d="M 154 27 A 92 92 0 0 1 185 47" fill="none" stroke="#c0392b" stroke-width="3.5"/>
  <!-- ticks -->
  <g stroke="#3a3a3a" stroke-width="1.3">
    <line x1="55" y1="47" x2="61" y2="52"/>
    <line x1="85" y1="31" x2="89" y2="38"/>
    <line x1="120" y1="20" x2="120" y2="28"/>
    <line x1="155" y1="31" x2="151" y2="38"/>
    <line x1="185" y1="47" x2="179" y2="52"/>
  </g>
  <!-- needle (resting just under 0) -->
  <line x1="120" y1="112" x2="126" y2="26" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="120" cy="112" r="5" fill="#2a2a2a"/>
  <!-- labels -->
  <text x="120" y="78" text-anchor="middle" font-family="Liberation Sans Narrow, sans-serif"
        font-weight="700" font-size="15" letter-spacing="3" fill="#3a3a3a">VU</text>
  <text x="208" y="33" text-anchor="end" font-family="Liberation Sans Narrow, sans-serif"
        font-weight="700" font-size="9" fill="#c0392b">+3</text>
  <text x="104" y="106" text-anchor="middle" font-family="Liberation Sans Narrow, sans-serif"
        font-weight="700" font-size="8" letter-spacing="2" fill="#6b7a70">OUTPUT</text>
</svg>
