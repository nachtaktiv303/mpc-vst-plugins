<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 628" preserveAspectRatio="none">
  <defs>
    <linearGradient id="sil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0e2dc"/>
      <stop offset="0.5" stop-color="#cccec8"/>
      <stop offset="1" stop-color="#b6b8b2"/>
    </linearGradient>
    <linearGradient id="silb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b6b8b2"/>
      <stop offset="0.5" stop-color="#cccec8"/>
      <stop offset="1" stop-color="#d4d6d0"/>
    </linearGradient>
  </defs>
  <!-- green centre faceplate -->
  <rect width="1280" height="628" fill="#2d4626"/>
