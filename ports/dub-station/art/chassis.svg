  <rect x="0" y="0" width="1280" height="72" fill="url(#sil)"/>
  <line x1="0" y1="72" x2="1280" y2="72" stroke="#7f817a" stroke-width="1.5"/>
  <line x1="0" y1="73.5" x2="1280" y2="73.5" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1"/>
  <!-- bottom silver strip -->
  <rect x="0" y="572" width="1280" height="56" fill="url(#silb)"/>
  <line x1="0" y1="572" x2="1280" y2="572" stroke="#7f817a" stroke-width="1.5"/>
  <line x1="0" y1="570.5" x2="1280" y2="570.5" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1"/>
</svg>
