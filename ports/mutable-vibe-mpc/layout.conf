# Mutable Vibe MPC -- screen skin. Mutable-Instruments look (neutral light-grey panel, black knobs
# with white caps + white position line, thin faders with rectangular white caps, cyan/magenta
# accents), MPC system font (Titillium Web) baked. Pages: OVERVIEW / ENVELOPES / LFOS / EFFECTS / MOD.

theme_bg=d2d3d4
theme_panel=dfe0e1
theme_line=9a9c9e
theme_ink=1b1c1d
theme_ink_dim=5a5c5e
theme_ink_faint=8f9193
theme_accent=0a97ad
theme_accent_hi=b32e86
theme_knob_face=161616
theme_knob_ring=7c7e80
theme_knob_dot=ffffff
theme_bar=c4c5c6
theme_tab_on=0a97ad
theme_tab_on_tx=ffffff
theme_btn_text=1b1c1d
theme_seg_active=0a97ad
theme_seg_inactive=c6c7c8
theme_seg_active_tx=ffffff
theme_lcd=e9eaeb
font_title=tools/html_art/fonts/TitilliumWeb-SemiBold.ttf
font_label=tools/html_art/fonts/TitilliumWeb-Regular.ttf

[tab OVERVIEW]
frame x=10 y=92 w=1258 h=304 title="ENGINE"
popup cx=110 cy=222 w=170 h=48 label="MODEL" key=model
