knob cx=1180 cy=222 r=36 label="OCTAVE" key=octave
frame x=10 y=404 w=626 h=304 title="FILTER"
knob cx=105 cy=534 r=36 label="CUTOFF" key=filterCutoff
knob cx=263 cy=534 r=36 label="RESONANCE" key=filterResonance
knob cx=421 cy=534 r=36 label="FILTER ENV" key=filterEnvAmount
enum_v cx=561 cy=534 label="SLOPE" key=filterSlope options="12 DB,24 DB" sw=68
frame x=642 y=404 w=626 h=304 title="SENDS"
knob cx=735 cy=534 r=36 label="REVERB" key=reverbWet
knob cx=875 cy=534 r=36 label="DELAY" key=delayWet
